name: Deploy to GitHub Pages

# The site (2026-11-13): a front page listing both versions, newest first; V2 at v2/, built from main with its
# model export and program; V1 at v1/, built from the v1 branch as it was; the methodology page beside them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: v1
          path: v1-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build V2
        working-directory: viewer
        run: |
          npm ci
          npx vite build --base=./
      - name: Build V1
        working-directory: v1-src
        run: |
          npm ci
          npx vite build --base=./
      - name: Assemble the site
        run: |
          mkdir -p _site/v2 _site/v1
          cp -r viewer/dist/. _site/v2/
          mkdir -p _site/v2/exports && cp -r exports/. _site/v2/exports/
          cp -r program _site/v2/program
          cp -r v1-src/dist/. _site/v1/
          cp pages/index.html _site/index.html
          cp research/methodology.html _site/methodology.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
